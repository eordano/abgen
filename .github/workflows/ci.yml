name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The sanitizer job is the only thing this triggers, and it is far too slow
    # to sit in front of a PR.
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Runs the existing test suite under ASan to check the unsafe FFI/CUDA/SIMD
  # code; only sees inputs the tests already exercise. miri is not an
  # alternative: it can't execute the C/C++ deps (draco, libjpeg, crunch).
  sanitizers:
    name: address sanitizer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Bounds a nightly job that could otherwise wedge on the CUDA or SIMD
    # paths and burn the default six-hour timeout unattended.
    timeout-minutes: 90
    env:
      # -D warnings from the top-level env would fail the build on lints the
      # instrumentation itself provokes, and the sanitizer flags have to reach
      # the C deps too or their allocations stay invisible.
      RUSTFLAGS: -Zsanitizer=address
      CFLAGS: -fsanitize=address -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
      # detect_leaks stays off: rayon's pool and the CUDA runtime hold
      # allocations for the process lifetime by design, and reporting those as
      # leaks would bury a real finding.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          # Sanitizers are nightly-only. This is the one place the pinned 1.97.0
          # does not apply; nothing built here ships.
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # --target is load-bearing: without it the build scripts are instrumented
      # too and run under a sanitizer they were never linked against.
      - name: cargo test under ASan
        run: |
          ABGEN_ROOT="$GITHUB_WORKSPACE" cargo test --locked --workspace --lib \
            --target x86_64-unknown-linux-gnu -- --test-threads=1

  check:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: forbid node spawns
        run: |
          ! grep -rn 'Command::new("npm\|Command::new("node' crate/src
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: ABGEN_ROOT="$GITHUB_WORKSPACE" cargo test --locked --workspace --lib -- --test-threads=1
      - run: ABGEN_ROOT="$GITHUB_WORKSPACE" cargo test --locked -p abgen-native --tests
      - name: C ABI smoke test
        run: ABGEN_ROOT="$GITHUB_WORKSPACE" crate/abgen-native/tests/run-smoke.sh

      - name: glibc floor
        run: bash ci/check-glibc-floor.sh 2.34 target/release/libabgen.so target/release/libabgen.a

  windows:
    name: windows lib tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: lib tests
        shell: pwsh
        run: |
          $env:ABGEN_ROOT = $env:GITHUB_WORKSPACE
          cargo test --locked --workspace --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p abgen-native --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: native host smoke
        shell: pwsh
        run: |
          cargo build --release -p abgen-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/abgen-smoke.ps1 -Tree $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  excluded-hosts:
    name: excluded hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Built through napi, not cargo, so index.js/index.d.ts are regenerated
      # and diffed against what's committed. Those files are also the
      # package's entry point, so a #[napi] export added without
      # regenerating them compiles into the binary but stays unreachable
      # from JavaScript.
      - name: abgen-node (build + smoke)
        working-directory: crate/abgen-node
        run: |
          npm ci --no-audit --no-fund
          npx napi build --platform --release -- --locked
          git diff --exit-code -- index.js index.d.ts \
            || { echo "index.js/index.d.ts are stale; run 'napi build --platform --release' and commit them" >&2; exit 1; }
          node test/smoke.mjs
          # The addon is dlopen'd into node and so is bound by the host's
          # glibc exactly like libabgen.so is by Unity's. Paths are relative to
          # crate/abgen-node now that the step runs there.
          bash ../../ci/check-glibc-floor.sh 2.34 \
            target/release/libabgen_node.so
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # Its own '-wasm-' key family: this store only holds the wasm toolchain
      # closure, and sharing a family with the image caches would let their
      # purge rotation evict it (and vice versa).
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-wasm-${{ hashFiles('crate/abgen-wasm/toolchain/flake.lock', 'crate/abgen-wasm/toolchain/flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-wasm-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-wasm-
          purge-last-accessed: 604800
          purge-primary-key: never
      - name: abgen-wasm (wasm32)
        run: |
          cd crate/abgen-wasm
          nix develop "path:$PWD/toolchain" --command \
            env RUSTFLAGS='-C target-feature=+simd128' \
            cargo check --locked --release --target wasm32-unknown-unknown
