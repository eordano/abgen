name: docker-and-extras

# Builds the thin vast.ai base runner (docker-and-extras/Dockerfile) and pushes
# it to GHCR. This image carries only the tooling (ssh/nix/docker/rsync +
# cuda/vulkan plumbing) — abgen itself is pulled or nix-built at runtime.

on:
  push:
    branches: ["docker-and-extras"]
    paths:
      - "docker-and-extras/**"
      - ".github/workflows/docker-and-extras.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-and-extras-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR via the workflow's built-in GITHUB_TOKEN — no external creds. vast pulls
  # this by full ref (ghcr.io/eordano/abgen-on-docker); make the package public
  # once (repo → Packages → visibility) or give vast a read token for a private pull.
  IMAGE: ghcr.io/eordano/abgen-on-docker

jobs:
  image:
    name: build + push (buildx)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: docker-and-extras
          file: docker-and-extras/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        run: |
          {
            echo "### abgen-on-docker runner image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}:latest\` and \`${IMAGE}:${GITHUB_SHA}\` |"
            echo "| base  | CUDA runtime (ubuntu 22.04) + ssh/nix/docker/rsync |"
            echo "| note  | thin — abgen is pulled/nix-built at runtime, not baked |"
            echo ""
            echo "Set the Docker Hub repo to public once via its Settings, or use it"
            echo "as a private image with vast registry credentials."
          } >> "$GITHUB_STEP_SUMMARY"
