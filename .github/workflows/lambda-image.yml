name: lambda-image

# Builds .#lambdaImage (the abgen-lambda converter, arm64) with nix and pushes
# it to the ECR repo provisioned by the `abgen-pipeline` Pulumi stack — Lambda
# container functions can only pull from ECR, so this image skips ghcr/quay.
#
# The image is nix-built (dockerTools.buildLayeredImage in flake.nix), not a
# Dockerfile: deterministic contents pinned by flake.lock, no base OS, and the
# nix store cache means an unchanged dep tree costs seconds, not a full
# cargo-from-scratch rebuild like `docker build` did.
#
# Auth is GitHub OIDC → sts:AssumeRoleWithWebIdentity, done with plain curl +
# aws-cli instead of a third-party action. Repository variables required:
#   ABGEN_LAMBDA_ECR_ROLE_ARN    IAM role exported by the abgen-pipeline stack
#                                (`ciEcrPushRoleArn`)
#   ABGEN_LAMBDA_ECR_REPOSITORY  ECR repo URL (`ecrRepositoryUrl` output)
#   ABGEN_LAMBDA_AWS_REGION      e.g. us-east-1
#
# Pushing a tag does NOT roll the function: Lambda pins the image digest at
# deploy time. After a push, `pulumi config set imageTag <tag> && pulumi up`
# in the abgen-pipeline stack rolls it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lambda-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambda-image:
    name: build + push (nix, arm64 → ECR)
    # Native arm64 runner: the image targets Graviton Lambda, so no QEMU and
    # no cross-compilation — nix builds the aarch64-linux output natively.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0

      # runner.arch is part of the key: this cache holds aarch64 store paths
      # and must never cross with the x86_64 cache image.yml writes. Key and
      # purge rationale in image.yml; cache-warm.yml populates the same keys
      # on main pushes so tag builds start warm.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/Cargo.toml', 'flake.nix', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 4294967296
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-last-accessed: 604800
          purge-primary-key: never

      - name: assume ECR push role (OIDC)
        run: |
          role="${{ vars.ABGEN_LAMBDA_ECR_ROLE_ARN }}"
          region="${{ vars.ABGEN_LAMBDA_AWS_REGION }}"
          if [ -z "$role" ] || [ -z "$region" ]; then
            echo "::error::ABGEN_LAMBDA_ECR_ROLE_ARN / ABGEN_LAMBDA_AWS_REGION repository variables are not set"
            exit 1
          fi
          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "$role" \
            --role-session-name "abgen-lambda-ci-${GITHUB_RUN_ID}" \
            --web-identity-token "$token" \
            --duration-seconds 3600 \
            --query Credentials --output json)"
          {
            echo "AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r .AccessKeyId)"
            echo "AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r .SecretAccessKey)"
            echo "AWS_SESSION_TOKEN=$(echo "$creds" | jq -r .SessionToken)"
            echo "AWS_REGION=${region}"
          } >> "$GITHUB_ENV"

      - name: build image
        run: |
          ref="${GITHUB_REF_NAME:-dev}"
          echo "::group::nix build .#lambdaImage — ${GITHUB_REPOSITORY} @ ${ref}"
          nix build .#lambdaImage --print-build-logs
          echo "store path : $(readlink -f result)"
          echo "compressed : $(ls -lLh result | awk '{print $5}')"
          echo "::endgroup::"
          {
            echo "REF=${ref}"
            echo "IMG_SIZE=$(ls -lLh result | awk '{print $5}')"
          } >> "$GITHUB_ENV"

      - name: push to ECR
        run: |
          repo="${{ vars.ABGEN_LAMBDA_ECR_REPOSITORY }}"
          registry="${repo%%/*}"
          password="$(aws ecr get-login-password)"
          conf="$(mktemp)"
          echo 'unqualified-search-registries = []' > "$conf"
          # --inputs-from .: skopeo comes from the flake's locked nixpkgs, not
          # whatever the flake registry resolves to today.
          for tag in "${REF}" latest; do
            echo "::group::push ${repo}:${tag}"
            nix run --inputs-from . nixpkgs#skopeo -- \
              --registries-conf "$conf" --insecure-policy copy \
              --dest-creds "AWS:${password}" \
              "docker-archive:$(readlink -f result)" \
              "docker://${repo}:${tag}"
            echo "::endgroup::"
          done
          digest="$(nix run --inputs-from . nixpkgs#skopeo -- \
            --registries-conf "$conf" --insecure-policy inspect \
            --creds "AWS:${password}" --format '{{.Digest}}' \
            "docker://${repo}:${REF}")"
          {
            echo "### abgen-lambda container image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${repo}:${REF}\` (and \`:latest\`) |"
            echo "| digest | \`${digest}\` |"
            echo "| size | ${IMG_SIZE} compressed, no base OS |"
            echo "| arch | arm64 (Graviton Lambda) |"
            echo "| build | \`nix build .#lambdaImage\` — deterministic, pinned \`flake.lock\` |"
            echo "| roll out | \`pulumi config set imageTag ${REF} && pulumi up\` in abgen-pipeline |"
          } >> "$GITHUB_STEP_SUMMARY"
