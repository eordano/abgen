[package]
name = "abgen"
version.workspace = true
edition = "2021"
description = "Decentraland asset-bundle converter + ab-cdn-compatible JIT server — clean-room reimplementation of asset-bundle-converter."
license = "Apache-2.0"

autobins = false
autoexamples = false
autotests = false
autobenches = false

[features]
default = ["server"]
# The ab-cdn JIT server + registry HTTP surface and their axum/Postgres stack.
# abgen-lambda opts out (default-features = false) and gets the conversion
# core alone — no sqlx, axum, or tokio in that build.
server = [
    "dep:axum",
    "dep:dcl-contents",
    "dep:ethers-core",
    "dep:metrics-exporter-prometheus",
    "dep:moka",
    "dep:sqlx",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tower-http",
]

[lib]
name = "abgen"
path = "src/lib.rs"

[[bin]]
name = "abgen"
path = "src/bin/abgen.rs"
required-features = ["server"]

[[bin]]
name = "abgen-build"
path = "src/bin/abgen-build.rs"

[[bin]]
name = "abgen-corpus"
path = "src/bin/abgen-corpus/main.rs"

[[bin]]
name = "abgen-verify"
path = "src/bin/abgen-verify.rs"

[[bin]]
name = "abgen-lod"
path = "src/bin/abgen-lod/main.rs"

[[example]]
name = "texdump"
path = "examples/texdump.rs"

[[example]]
name = "matdump"
path = "examples/matdump.rs"

[[example]]
name = "objdump"
path = "examples/objdump.rs"

[[example]]
name = "texcmp"
path = "examples/texcmp.rs"

[[example]]
name = "texpng"
path = "examples/texpng.rs"

[[example]]
name = "atlasprobe"
path = "examples/atlasprobe.rs"

[build-dependencies]
# Compiles compat/isoc23_shim.c on linux-gnu — see crate/build.rs. Already in
# the lock file via crunch_ffi/libmimalloc-sys, so this adds an edge, not a
# package.
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
psd = "0.3"
libc = "0.2"
rayon = "1"
num_cpus = "1"
anyhow = "1"
brotli = "8"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
libm = "=0.2.16"
draco_decoder = { path = "third_party/draco_decoder" }
texpresso = "2"
crunch_ffi = { path = "third_party/crunch" }
libjpeg9c = { path = "third_party/libjpeg9c" }
texture2ddecoder = "0.1"
chrono = "0.4"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_mikktspace = "=1.0.0"
ddsfile = "=0.5.2"
gltf-json = { version = "=1.4.1", features = ["names", "extras", "extensions", "KHR_lights_punctual", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_volume", "KHR_materials_unlit", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
image = "0.25"
ureq = "3"
memmap2 = "0.9"
meshopt = "=0.6.2"
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", optional = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true }
tower-http = { version = "0.7", features = ["trace"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
moka = { version = "0.12", features = ["future"], optional = true }
# No default features: `any` is unused and `macros`/`derive` would build
# sqlx-macros plus a second host copy of sqlx-postgres. `migrate` re-enables
# just the macro parts that `sqlx::migrate!` in registry/mod.rs needs.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros", "migrate"], optional = true }
dcl-contents = { path = "dcl-contents", optional = true }
ethers-core = { version = "2.0.14", optional = true }
hex = "0.4"
thiserror = "2"
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"] }
rquickjs = { version = "0.12", default-features = false, features = ["std", "array-buffer"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tga"] }
meshopt = "=0.6.2"
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "webgpu"] }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64", target_env = "gnu"))'.dependencies]
# rquickjs-sys picks bindings by exact triple and ships none for gnullvm (msvc
# and x86_64-gnu both have one), so they must be generated. A target dep rather
# than a `--features` flag because abgen-native depends on abgen, not rquickjs,
# and so cannot forward the flag.
rquickjs = { version = "0.12", default-features = false, features = ["bindgen"] }

[target.'cfg(all(not(target_os = "windows"), not(target_arch = "wasm32")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(not(any(target_arch = "wasm32", all(target_os = "windows", target_env = "gnu"))))'.dependencies]

[[bench]]
name = "kernels"
path = "benches/kernels.rs"
harness = false

[[bin]]
name = "abgen-bench"
path = "src/bin/abgen-bench.rs"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[example]]
name = "bc7-parity-o08"
path = "examples/bc7_parity_o08.rs"

[[test]]
name = "o15_parity"
path = "tests/o15_parity.rs"
[[test]]
name = "bc7_parity"
path = "tests/bc7_parity.rs"
harness = true
[[test]]
name = "crn_parity"
path = "tests/crn_parity.rs"
[[test]]
name = "dxt1_corpus_hash"
path = "tests/dxt1_corpus_hash.rs"
harness = true
